<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="基金透镜收藏页：按标签整理并快速打开收藏的基金。"
    />
    <meta name="theme-color" content="#151916" />
    <meta name="application-name" content="基金透镜" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="我的收藏" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>我的收藏｜基金透镜</title>
    <link rel="manifest" href="/static/watchlist.webmanifest?v=20260803.2" />
    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg?v=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png?v=1" />
    <link rel="stylesheet" href="/static/styles.css?v=20260803.22" />
    <link rel="stylesheet" href="/static/watchlist.css?v=20260803.6" />
    <link rel="stylesheet" href="/static/watchlist-page.css?v=20260803.2" />
  </head>
  <body class="watchlist-page-body">
    <div class="paper-noise" aria-hidden="true"></div>

    <header class="site-header watchlist-page-header">
      <a class="brand" href="/" aria-label="返回基金透镜研究台">
        <span class="brand-mark">FL</span>
        <span>
          <strong>基金透镜</strong>
          <small>MY WATCHLIST / CN</small>
        </span>
      </a>
      <nav class="header-actions" aria-label="收藏页面导航">
        <a class="header-tool-trigger watchlist-page-nav" href="/search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="M15.5 15.5L21 21" />
          </svg>
          <span>查询基金</span>
          <b aria-hidden="true">↗</b>
        </a>
      </nav>
    </header>

    <main class="watchlist-page-main">
      <header class="watchlist-heading watchlist-page-heading">
        <p class="eyebrow">SAVED FUNDS / 本地收藏</p>
        <div class="watchlist-title-line">
          <h1 id="watchlist-title">我的收藏</h1>
          <span id="watchlist-total">0 FUNDS</span>
        </div>
      </header>

      <section class="watchlist-page-content" aria-labelledby="watchlist-title">
        <div class="watchlist-toolbar" aria-label="按标签筛选收藏基金">
          <div class="watchlist-filter-shell">
            <strong>TAG FILTER</strong>
            <div
              id="watchlist-tag-filters"
              class="watchlist-tag-filters"
              aria-label="标签快速筛选"
            ></div>
          </div>
          <div class="watchlist-page-status">
            <span id="watchlist-feedback" class="watchlist-feedback" aria-live="polite"></span>
            <button id="watchlist-refresh" type="button">刷新</button>
          </div>
        </div>

        <section id="watchlist-list" class="watchlist-list" aria-live="polite"></section>
        <section id="watchlist-empty" class="watchlist-empty" hidden>
          <span aria-hidden="true">☆</span>
          <div>
            <p class="eyebrow">NO FUNDS SAVED / 尚无收藏</p>
            <h2>从一只正在研究的基金开始。</h2>
            <p>返回研究台查询基金，再点击档案右侧的“收藏基金”。</p>
            <a class="watchlist-page-link" href="/search">去查询基金 <b aria-hidden="true">↗</b></a>
          </div>
        </section>
      </section>
    </main>

    <footer class="site-footer watchlist-page-footer">
      <span>FUND LENS / 我的收藏</span>
      <a href="/">返回基金研究台</a>
    </footer>

    <script src="/static/watchlist-page.js?v=20260803.2" defer></script>
  </body>
</html>
